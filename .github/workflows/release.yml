name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/arch-opsd dist/arch-opsd-linux-aarch64

      - run: cargo build --release --features http
      - run: |
          cp target/release/arch-opsd dist/arch-opsd-linux-aarch64-http
          strip dist/arch-opsd-linux-aarch64
          strip dist/arch-opsd-linux-aarch64-http

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false

  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release
      - run: |
          mkdir -p dist
          cp target/release/arch-opsd dist/arch-opsd-linux-x86_64

      - run: cargo build --release --features http
      - run: |
          cp target/release/arch-opsd dist/arch-opsd-linux-x86_64-http
          strip dist/arch-opsd-linux-x86_64
          strip dist/arch-opsd-linux-x86_64-http

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
