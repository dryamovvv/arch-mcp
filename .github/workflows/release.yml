name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary (default — STDIO)
        run: cargo build --release

      - name: Build release binary (http — STDIO + HTTP/SSE)
        run: cargo build --release --features http

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/release/arch-opsd dist/arch-opsd-linux-aarch64-http

      - name: Build release binary (default — STDIO only)
        run: cargo build --release

      - name: Finalize release assets
        run: |
          cp target/release/arch-opsd dist/arch-opsd-linux-aarch64
          strip dist/arch-opsd-linux-aarch64
          strip dist/arch-opsd-linux-aarch64-http

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
