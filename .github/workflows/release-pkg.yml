name: Release Arch Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-pkg:
    name: Build .pkg.tar.zst (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Build aarch64 package in Docker
        run: |
          docker run --rm \
            -v $PWD:/workspace -w /workspace \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm &&
              pacman -S --noconfirm base-devel git uv python &&
              useradd -m builder &&
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
              sed -i \"s/^pkgver=.*/pkgver=$VER/\" packaging/arch/PKGBUILD &&
              chown -R builder:builder . &&
              su builder -c 'cd packaging/arch && makepkg -sf --noconfirm'
            "

      - name: Rename with arch suffix
        run: |
          for f in packaging/arch/arch-ops-server-*.pkg.tar.zst; do
            base="${f%.pkg.tar.zst}"
            mv "$f" "${base}-aarch64.pkg.tar.zst"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/arch-ops-server-*.pkg.tar.zst
          fail_on_unmatched_files: true
