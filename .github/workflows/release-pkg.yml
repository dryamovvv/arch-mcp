name: Release Arch Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot pacman-package-manager python3 python-is-python3
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$VER/" packaging/arch/PKGBUILD

      - name: Build package
        run: |
          cd packaging/arch
          makepkg -sf --noconfirm --nodeps

      - name: Rename with arch suffix
        run: |
          for f in packaging/arch/arch-ops-server-*.pkg.tar.*; do
            base="${f%.pkg.tar.*}"
            ext="${f##*.}"
            mv "$f" "${base}-aarch64.pkg.tar.${ext}"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/arch-ops-server-*.pkg.tar.*
          fail_on_unmatched_files: true
