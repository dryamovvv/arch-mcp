name: Release Arch Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-pkg:
    name: Build .pkg.tar.zst (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runs-on }}
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git uv python

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$VER/" packaging/arch/PKGBUILD

      - name: Build package
        run: |
          chown -R builder:builder .
          su builder -c "cd packaging/arch && makepkg -sf --noconfirm"

      - name: Rename package with arch suffix
        run: |
          for f in packaging/arch/arch-ops-server-*.pkg.tar.zst; do
            base="${f%.pkg.tar.zst}"
            mv "$f" "${base}-${{ matrix.arch }}.pkg.tar.zst"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/arch-ops-server-*.pkg.tar.zst
          fail_on_unmatched_files: true
