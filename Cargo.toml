[package]
name = "arch-opsd"
version = "0.1.0"
edition = "2021"
description = "MCP server for Arch Linux ecosystem — single static binary"

[[bin]]
name = "arch-opsd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
scraper = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
once_cell = "1"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[features]
default = []
http = ["dep:axum", "dep:tower-http"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
